services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # No "ports:" on purpose -> MongoDB is NOT exposed to the internet

  backend:
    image: ${IMAGE_PREFIX}/myapp-backend:latest
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/myapp?authSource=admin
    depends_on:
      - mongo

  frontend:
    image: ${IMAGE_PREFIX}/myapp-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: